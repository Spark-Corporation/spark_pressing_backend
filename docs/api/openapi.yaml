                  nullable: true
                password:
                  type: string
                  description: validation.min.
                  example: "'YAKYLk4>SJIrIV#lz."
                sponsor_code:
                  type: string
                  description: validation.max.
                  example: lsmsjuryvo
                  nullable: true
              required:
