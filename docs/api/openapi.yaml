openapi: 3.0.3
info:
  title: 'Spark Pressing API API Documentation'
  description: 'API REST Spark Pressing — multi-tenant (pressing / agence), Sanctum, montants en XAF entiers.'
  version: 1.0.0
servers:
  -
    url: 'https://pressing-api.pressingelegance.com'
tags:
  -
    name: Authentification
    description: ''
  -
    name: POS
    description: ''
  -
    name: Dépôts
    description: 'Cycle dépôt → paiement → atelier → retrait.'
  -
    name: Clients
    description: ''
  -
    name: Catalogue
    description: 'Tarifs par agence (séparés du catalogue).'
  -
    name: Caisse
    description: ''
  -
    name: Recettes
    description: ''
  -
    name: Rapports
    description: ''
  -
    name: Organisation
    description: 'Taux de change (consolidation multi-devise).'
  -
    name: 'Espace client'
    description: ''
  -
    name: Superadmin
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Livraison
    description: 'Module Livreur v3.0 — tournées, marquage livré, encaissement mobile.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtenez le token via `POST /api/v1/auth/staff/login` (email + password). Sur les routes staff, envoyez aussi `X-Agency-Id` pour filtrer une agence.'
security:
  -
    default: []
paths:
  /api/v1/auth/staff/login:
    post:
      summary: 'Connexion staff'
      operationId: connexionStaff
      description: 'Retourne un token Sanctum Bearer et le profil staff (rôles, agence, pressing).'
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: Succès
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 1|abcExampleSanctumToken
                    token_type: Bearer
                    actor: staff
                    user:
                      id: 1
                      fullname: 'Claire Caissier'
                      email: caissier@elegance.local
                      phone_number: null
                      pressing_id: 1
                      agency_id: 1
                      status: true
                      roles:
                        - caissier
                      agency:
                        id: 1
                        pressing_id: 1
                        name: Akwa
                        address: 'Douala, Akwa'
                        contact: '+237600000001'
                        country_code: CM
                        currency: XAF
                        code_prefix: AK
                        code_suffix: EL
                        status: true
                      agencies:
                        -
                          id: 1
                          pressing_id: 1
                          name: Akwa
                          address: 'Douala, Akwa'
                          contact: '+237600000001'
                          country_code: CM
                          currency: XAF
                          code_prefix: AK
                          code_suffix: EL
                          status: true
                      pressing:
                        id: 1
                        name: 'Élégance Pressing'
                        details: 'Enseigne de démonstration'
                        status: true
                        pricing_mode: piece
                        workflow_laveur_enabled: true
                        workflow_classeur_enabled: true
                        qr_labels_enabled: false
                        block_retrieve_if_unpaid: true
                        reporting_currency: null
                        collection_fee: 0
                        delivery_fee: 0
                        loyalty_points_rate: 0
                        hours_classic: null
                        hours_express: null
                        hours_repass: null
                      can_view_all_agencies: false
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abcExampleSanctumToken
                      token_type:
                        type: string
                        example: Bearer
                      actor:
                        type: string
                        example: staff
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          fullname:
                            type: string
                            example: 'Claire Caissier'
                          email:
                            type: string
                            example: caissier@elegance.local
                          phone_number:
                            type: string
                            example: null
                            nullable: true
                          pressing_id:
                            type: integer
                            example: 1
                          agency_id:
                            type: integer
                            example: 1
                          status:
                            type: boolean
                            example: true
                          roles:
                            type: array
                            example:
                              - caissier
                            items:
                              type: string
                          agency:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              pressing_id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: Akwa
                              address:
                                type: string
                                example: 'Douala, Akwa'
                              contact:
                                type: string
                                example: '+237600000001'
                              country_code:
                                type: string
                                example: CM
                              currency:
                                type: string
                                example: XAF
                              code_prefix:
                                type: string
                                example: AK
                              code_suffix:
                                type: string
                                example: EL
                              status:
                                type: boolean
                                example: true
                          agencies:
                            type: array
                            example:
                              -
                                id: 1
                                pressing_id: 1
                                name: Akwa
                                address: 'Douala, Akwa'
                                contact: '+237600000001'
                                country_code: CM
                                currency: XAF
                                code_prefix: AK
                                code_suffix: EL
                                status: true
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                pressing_id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: Akwa
                                address:
                                  type: string
                                  example: 'Douala, Akwa'
                                contact:
                                  type: string
                                  example: '+237600000001'
                                country_code:
                                  type: string
                                  example: CM
                                currency:
                                  type: string
                                  example: XAF
                                code_prefix:
                                  type: string
                                  example: AK
                                code_suffix:
                                  type: string
                                  example: EL
                                status:
                                  type: boolean
                                  example: true
                          pressing:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: 'Élégance Pressing'
                              details:
                                type: string
                                example: 'Enseigne de démonstration'
                              status:
                                type: boolean
                                example: true
                              pricing_mode:
                                type: string
                                example: piece
                              workflow_laveur_enabled:
                                type: boolean
                                example: true
                              workflow_classeur_enabled:
                                type: boolean
                                example: true
                              qr_labels_enabled:
                                type: boolean
                                example: false
                              block_retrieve_if_unpaid:
                                type: boolean
                                example: true
                              reporting_currency:
                                type: string
                                example: null
                                nullable: true
                              collection_fee:
                                type: integer
                                example: 0
                              delivery_fee:
                                type: integer
                                example: 0
                              loyalty_points_rate:
                                type: integer
                                example: 0
                              hours_classic:
                                type: string
                                example: null
                                nullable: true
                              hours_express:
                                type: string
                                example: null
                                nullable: true
                              hours_repass:
                                type: string
                                example: null
                                nullable: true
                          can_view_all_agencies:
                            type: boolean
                            example: false
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Compte désactivé'
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                  meta:
                    message: 'Compte désactivé.'
                  errors:
                    -
                      code: error
                      detail: 'Compte désactivé.'
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Compte désactivé.'
                  errors:
                    type: array
                    example:
                      -
                        code: error
                        detail: 'Compte désactivé.'
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: error
                        detail:
                          type: string
                          example: 'Compte désactivé.'
        422:
          description: 'Identifiants invalides'
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                  meta:
                    message: 'Les données sont invalides.'
                  errors:
                    -
                      code: validation
                      field: email
                      detail: 'Identifiants invalides.'
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Les données sont invalides.'
                  errors:
                    type: array
                    example:
                      -
                        code: validation
                        field: email
                        detail: 'Identifiants invalides.'
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: validation
                        field:
                          type: string
                          example: email
                        detail:
                          type: string
                          example: 'Identifiants invalides.'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email du compte staff.'
                  example: caissier@elegance.local
                password:
                  type: string
                  description: 'Mot de passe.'
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/staff/forgot-password:
    post:
      summary: 'Mot de passe oublié'
      operationId: motDePasseOubli
      description: ''
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: 'Lien envoyé (toujours 200 pour ne pas divulguer l’existence du compte)'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    sent: true
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        example: true
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: caissier@elegance.local
              required:
                - email
      security: []
  /api/v1/auth/staff/reset-password:
    post:
      summary: 'Réinitialiser le mot de passe'
      operationId: rinitialiserLeMotDePasse
      description: ''
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: 'Mot de passe réinitialisé'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    reset: true
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      reset:
                        type: boolean
                        example: true
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: caissier@elegance.local
                token:
                  type: string
                  description: 'Token reçu par email.'
                  example: reset-token
                password:
                  type: string
                  description: ''
                  example: password
                password_confirmation:
                  type: string
                  description: ''
                  example: password
              required:
                - email
                - token
                - password
                - password_confirmation
      security: []
  /api/v1/auth/client/login:
    post:
      summary: 'Connexion client'
      operationId: connexionClient
      description: 'Login par email ou téléphone. Retourne un token Bearer et le profil client.'
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: Succès
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 2|abcExampleClientToken
                    token_type: Bearer
                    actor: client
                    user:
                      id: 1
                      pressing_id: 1
                      agency_id: 1
                      code: C000001
                      fullname: 'Jean Client'
                      email: jean.client@example.com
                      phone_number: '690000001'
                      address: null
                      city: null
                      loyalty_points: 0
                      wallet_balance: 0
                      sponsor_code: JEAN01
                      referred_by_id: null
                      last_deposit_at: null
                      status: true
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 2|abcExampleClientToken
                      token_type:
                        type: string
                        example: Bearer
                      actor:
                        type: string
                        example: client
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          pressing_id:
                            type: integer
                            example: 1
                          agency_id:
                            type: integer
                            example: 1
                          code:
                            type: string
                            example: C000001
                          fullname:
                            type: string
                            example: 'Jean Client'
                          email:
                            type: string
                            example: jean.client@example.com
                          phone_number:
                            type: string
                            example: '690000001'
                          address:
                            type: string
                            example: null
                            nullable: true
                          city:
                            type: string
                            example: null
                            nullable: true
                          loyalty_points:
                            type: integer
                            example: 0
                          wallet_balance:
                            type: integer
                            example: 0
                          sponsor_code:
                            type: string
                            example: JEAN01
                          referred_by_id:
                            type: string
                            example: null
                            nullable: true
                          last_deposit_at:
                            type: string
                            example: null
                            nullable: true
                          status:
                            type: boolean
                            example: true
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
        422:
          description: 'Identifiants invalides'
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                  meta:
                    message: 'Les données sont invalides.'
                  errors:
                    -
                      code: validation
                      field: email
                      detail: 'Identifiants invalides.'
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Les données sont invalides.'
                  errors:
                    type: array
                    example:
                      -
                        code: validation
                        field: email
                        detail: 'Identifiants invalides.'
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: validation
                        field:
                          type: string
                          example: email
                        detail:
                          type: string
                          example: 'Identifiants invalides.'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: 'Email ou numéro de téléphone.'
                  example: jean.client@example.com
                password:
                  type: string
                  description: 'Mot de passe.'
                  example: password
              required:
                - login
                - password
      security: []
  /api/v1/auth/client/register:
    post:
      summary: 'Inscription client'
      operationId: inscriptionClient
      description: 'Crée un compte client et retourne immédiatement un token Bearer.'
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        201:
          description: Créé
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 3|abcExampleRegisterToken
                    token_type: Bearer
                    actor: client
                    user:
                      id: 2
                      pressing_id: 1
                      agency_id: 1
                      code: C000002
                      fullname: 'Marie Dupont'
                      email: marie@example.com
                      phone_number: '690000099'
                      address: null
                      city: null
                      loyalty_points: 0
                      wallet_balance: 0
                      sponsor_code: MARIE1
                      referred_by_id: 1
                      last_deposit_at: null
                      status: true
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 3|abcExampleRegisterToken
                      token_type:
                        type: string
                        example: Bearer
                      actor:
                        type: string
                        example: client
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          pressing_id:
                            type: integer
                            example: 1
                          agency_id:
                            type: integer
                            example: 1
                          code:
                            type: string
                            example: C000002
                          fullname:
                            type: string
                            example: 'Marie Dupont'
                          email:
                            type: string
                            example: marie@example.com
                          phone_number:
                            type: string
                            example: '690000099'
                          address:
                            type: string
                            example: null
                            nullable: true
                          city:
                            type: string
                            example: null
                            nullable: true
                          loyalty_points:
                            type: integer
                            example: 0
                          wallet_balance:
                            type: integer
                            example: 0
                          sponsor_code:
                            type: string
                            example: MARIE1
                          referred_by_id:
                            type: integer
                            example: 1
                          last_deposit_at:
                            type: string
                            example: null
                            nullable: true
                          status:
                            type: boolean
                            example: true
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pressing_id:
                  type: integer
                  description: 'ID du pressing.'
                  example: 1
                agency_id:
                  type: integer
                  description: 'Agence de rattachement.'
                  example: 1
                fullname:
                  type: string
                  description: 'Nom complet.'
                  example: 'Marie Dupont'
                phone_number:
                  type: string
                  description: 'Téléphone unique par pressing.'
                  example: '690000099'
                email:
                  type: string
                  description: 'Email optionnel.'
                  example: marie@example.com
                password:
                  type: string
                  description: 'Mot de passe (min. 8).'
                  example: password
                sponsor_code:
                  type: string
                  description: 'Code parrainage.'
                  example: JEAN01
              required:
                - pressing_id
                - fullname
                - phone_number
                - password
      security: []
  /api/v1/auth/superadmin/login:
    post:
      summary: 'Connexion superadmin'
      operationId: connexionSuperadmin
      description: 'Back-office multi-pressing. `actor` vaut `superadmin`.'
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: Succès
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 4|abcExampleSuperadminToken
                    token_type: Bearer
                    actor: superadmin
                    user:
                      id: 1
                      fullname: 'Super Admin SPARK'
                      email: superadmin@spark.local
                      type: superadmin
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 4|abcExampleSuperadminToken
                      token_type:
                        type: string
                        example: Bearer
                      actor:
                        type: string
                        example: superadmin
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          fullname:
                            type: string
                            example: 'Super Admin SPARK'
                          email:
                            type: string
                            example: superadmin@spark.local
                          type:
                            type: string
                            example: superadmin
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
        422:
          description: 'Identifiants invalides'
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                  meta:
                    message: 'Les données sont invalides.'
                  errors:
                    -
                      code: validation
                      field: email
                      detail: 'Identifiants invalides.'
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Les données sont invalides.'
                  errors:
                    type: array
                    example:
                      -
                        code: validation
                        field: email
                        detail: 'Identifiants invalides.'
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: validation
                        field:
                          type: string
                          example: email
                        detail:
                          type: string
                          example: 'Identifiants invalides.'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email superadmin.'
                  example: superadmin@spark.local
                password:
                  type: string
                  description: 'Mot de passe.'
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Profil courant'
      operationId: profilCourant
      description: 'Retourne l’acteur authentifié (staff, client ou superadmin) selon le token Bearer.'
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: Staff
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    fullname: 'Claire Caissier'
                    email: caissier@elegance.local
                    phone_number: null
                    pressing_id: 1
                    agency_id: 1
                    status: true
                    roles:
                      - caissier
                    permissions:
                      - deposits.view
                      - deposits.create
                      - cash.manage
                    agency:
                      id: 1
                      name: Akwa
                      currency: XAF
                    agencies:
                      -
                        id: 1
                        name: Akwa
                    pressing:
                      id: 1
                      name: 'Élégance Pressing'
                    can_view_all_agencies: false
                  meta:
                    actor: staff
                    can_view_all_agencies: false
                    allowed_agency_ids:
                      - 1
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      fullname:
                        type: string
                        example: 'Claire Caissier'
                      email:
                        type: string
                        example: caissier@elegance.local
                      phone_number:
                        type: string
                        example: null
                        nullable: true
                      pressing_id:
                        type: integer
                        example: 1
                      agency_id:
                        type: integer
                        example: 1
                      status:
                        type: boolean
                        example: true
                      roles:
                        type: array
                        example:
                          - caissier
                        items:
                          type: string
                      permissions:
                        type: array
                        example:
                          - deposits.view
                          - deposits.create
                          - cash.manage
                        items:
