openapi: 3.0.3
info:
  title: 'Spark Pressing API API Documentation'
  description: 'API REST Spark Pressing — multi-tenant (pressing / agence), Sanctum, montants en XAF entiers.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Système
    description: ''
  -
    name: Authentification
    description: ''
  -
    name: POS
    description: ''
  -
    name: Dépôts
    description: 'Cycle dépôt → paiement → atelier → retrait.'
  -
    name: Clients
    description: ''
  -
    name: Catalogue
    description: 'Tarifs par agence (séparés du catalogue).'
  -
    name: Caisse
    description: ''
  -
    name: Recettes
    description: ''
  -
    name: Rapports
    description: ''
  -
    name: Organisation
    description: 'Taux de change (consolidation multi-devise).'
  -
    name: 'Espace client'
    description: ''
  -
    name: Superadmin
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Livraison
    description: 'Module Livreur v3.0 — tournées, marquage livré, encaissement mobile.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtenez le token via `POST /api/v1/auth/staff/login` (email + password). Sur les routes staff, envoyez aussi `X-Agency-Id` pour filtrer une agence.'
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: "Santé de l'API"
      operationId: santDeLAPI
      description: "Vérifie que l'API et la base sont joignables (sonde LB / ENF02)."
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    name: 'Spark Pressing API'
                    version: v1
                    status: ok
                    database: ok
                    currency: XAF
                    locale: fr
                  meta: {  }
                  errors: null
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'Spark Pressing API'
                      version:
                        type: string
                        example: v1
                      status:
                        type: string
                        example: ok
                      database:
                        type: string
                        example: ok
                      currency:
                        type: string
                        example: XAF
                      locale:
                        type: string
                        example: fr
                  meta:
                    type: object
                    properties: {  }
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Système
      security: []
  /api/v1/auth/staff/login:
    post:
      summary: 'Connexion staff'
      operationId: connexionStaff
      description: ''
      parameters:
        -
          in: header
          name: X-Agency-Id
          description: ''
          example: '1'
          schema:
            type: string
      responses: {  }
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: validation.email.
                  example: qkunze@example.com
                password:
                  type: string
                  description: ''
                  example: 'O[2UZ5ij-e/dl4m{o,'
              required:
                - email
                - password
      security: []
  /api/v1/auth/staff/forgot-password:
    post:
      summary: 'Mot de passe oublié'
