name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite, pdo_sqlite, pdo_mysql, bcmath
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Require deploy secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Secret manquant: FTP_HOST"; exit 1; }
          test -n "$FTP_USER" || { echo "Secret manquant: FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Secret manquant: FTP_PASSWORD"; exit 1; }
          test -n "$APP_KEY" || { echo "Secret manquant: APP_KEY (php artisan key:generate --show)"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "Secret manquant: DB_PASSWORD"; exit 1; }

      - name: Write production .env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          export APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"
          export CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-*}"
          export DB_HOST="${DB_HOST:-localhost}"
          export DB_DATABASE="${DB_DATABASE:-sparqrqm_pressing_api}"
          export DB_USERNAME="${DB_USERNAME:-sparqrqm_api}"
          php deploy/write-env.php
          test -f .env
          # Sanity only — le .env CI n'est PAS uploadé (prod géré sur le serveur).
          grep -qE '^APP_KEY=.+' .env || {
            echo "APP_KEY invalide dans .env généré"
            exit 1
          }

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 1200000
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/node_modules/**
            **/tests/**
            **/docker/**
            **/tools/**
            **/.scribe/**
            **/.idea/**
            **/.vscode/**
            **/.phpunit*
            **/phpunit.xml
            **/.phpunit.result.cache
            database/*.sqlite
            database/*.sqlite-journal
            deploy/**
            .env
            .env.*
            .env.backup
            .env.production
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**

      - name: Migrate + seed on server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          sed "s/__TOKEN__/${TOKEN}/" deploy/remote-post-deploy.php > /tmp/__deploy_post.php
          cleanup() {
            # Docroot = racine Laravel : supprimer le runner s'il reste
            curl --silent --ftp-pasv --user "${FTP_USER}:${FTP_PASSWORD}" \
              -Q "DELE __deploy_post.php" "ftp://${FTP_HOST}/" || true
            curl --silent --ftp-pasv --user "${FTP_USER}:${FTP_PASSWORD}" \
              -Q "DELE public/__deploy_post.php" "ftp://${FTP_HOST}/" || true
            curl --silent --ftp-pasv --user "${FTP_USER}:${FTP_PASSWORD}" \
              -Q "DELE public/__deploy_migrate.php" "ftp://${FTP_HOST}/" || true
          }
          trap cleanup EXIT
          # Placer à la racine (même niveau qu'artisan) pour éviter le rewrite public/
          curl --silent --show-error --ftp-pasv --user "${FTP_USER}:${FTP_PASSWORD}" \
            -T /tmp/__deploy_post.php "ftp://${FTP_HOST}/__deploy_post.php"
          echo "Running post-deploy…"
          HTTP_CODE="$(curl --silent --show-error --location \
            -o /tmp/post-deploy.json \
            -w '%{http_code}' \
            "${APP_URL%/}/__deploy_post.php?token=${TOKEN}")"
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/post-deploy.json || true
          echo
          test "${HTTP_CODE}" = "200" || {
            echo "Post-deploy HTTP ${HTTP_CODE}"
            exit 1
          }
          grep -q '"ok":true' /tmp/post-deploy.json || {
            echo "Post-deploy a échoué (ok != true)"
            exit 1
          }

      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"
          curl --silent --show-error --fail --location "${APP_URL%/}/api/v1/health"
          echo

      - name: Smoke test logins
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"

          login() {
            local path="$1"
            local body="$2"
            local label="$3"
            echo "Login ${label}…"
            RESP="$(curl --silent --show-error --fail --location \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d "${body}" \
              "${APP_URL%/}${path}")"
            echo "$RESP" | grep -q '"token"' || {
              echo "Échec login ${label}: ${RESP}"
              exit 1
            }
          }

          login "/api/v1/auth/staff/login" \
            '{"email":"caissier@elegance.local","password":"password"}' \
            "caissier"
          login "/api/v1/auth/staff/login" \
            '{"email":"admin@elegance.local","password":"password"}' \
            "admin"
          login "/api/v1/auth/superadmin/login" \
            '{"email":"superadmin@spark.local","password":"password"}' \
            "superadmin"
          login "/api/v1/auth/client/login" \
            '{"login":"jean.client@example.com","password":"password"}' \
            "client"

          echo "Tous les logins smoke OK"
