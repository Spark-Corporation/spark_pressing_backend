name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Require deploy secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          test -n "$FTP_HOST" || { echo "Secret manquant: FTP_HOST"; exit 1; }
          test -n "$FTP_USER" || { echo "Secret manquant: FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Secret manquant: FTP_PASSWORD"; exit 1; }
          test -n "$APP_KEY" || { echo "Secret manquant: APP_KEY (php artisan key:generate --show)"; exit 1; }

      - name: Write production .env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"
          CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-*}"
          sed \
            -e "s|__APP_KEY__|${APP_KEY}|" \
            -e "s|__APP_URL__|${APP_URL}|" \
            -e "s|__CORS_ALLOWED_ORIGINS__|${CORS_ALLOWED_ORIGINS}|" \
            deploy/env.production.template > .env

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 1200000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/node_modules/**
            **/tests/**
            **/docker/**
            **/tools/**
            **/.scribe/**
            **/.idea/**
            **/.vscode/**
            **/.phpunit*
            **/phpunit.xml
            **/.phpunit.result.cache
            database/*.sqlite
            database/*.sqlite-journal
            deploy/**
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**

      - name: Migrate database on server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          sed "s/__TOKEN__/${TOKEN}/" deploy/remote-migrate.php > /tmp/__deploy_migrate.php
          cleanup() {
            curl --silent --show-error --ftp-pasv --user "${FTP_USER}:${FTP_PASSWORD}" \
              -Q "DELE public/__deploy_migrate.php" "ftp://${FTP_HOST}/" || true
          }
          trap cleanup EXIT
          curl --silent --show-error --ftp-pasv --user "${FTP_USER}:${FTP_PASSWORD}" \
            -T /tmp/__deploy_migrate.php "ftp://${FTP_HOST}/public/__deploy_migrate.php"
          curl --silent --show-error --fail --location \
            "${APP_URL%/}/__deploy_migrate.php?token=${TOKEN}"

      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          APP_URL="${APP_URL:-https://pressing-api.pressingelegance.com}"
          curl --silent --show-error --fail --location "${APP_URL%/}/api/v1/health"
          echo
